name: Tests

on:
  push:
    branches: ['master']
    paths-ignore:
      - '**/wiki/**'
      - '/wiki/**'
      - 'docker-compose.yml'
      - '.env'
      - '*.sh'
  pull_request:
    paths-ignore:
      - '**/wiki/**'
      - '/wiki/**'
      - 'docker-compose.yml'
      - '.env'
      - '*.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the toolchain from mise.toml
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make env file
        env:
          ENV_DEVELOPMENT: ${{ secrets.ENV_DEVELOPMENT }}
        run: printf '%s\n' "$ENV_DEVELOPMENT" > .env.development

      - name: Make yt-cookies.json
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: printf '%s\n' "$YOUTUBE_COOKIES" > yt-cookies.json

      - name: Run tests
        run: pnpm run test
