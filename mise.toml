[tools]
node = "22.23.4"
pnpm = "12.18.0"
hk = "2.12.0"
pkl = "0.33.0"
betterleaks = "1.10.0"
jactionlint = "2.5.0"
# jactionlint runs it on workflow run: scripts
shellcheck = "0.11.0"
hadolint = "2.15.1"
typos = "1.52.1"
lychee = "0.24.2"

[tasks.check]
description = "Run every check, the same command CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the safe autofixes (formatting, spelling)"
run = "hk fix --all"

[tasks.links]
description = "Check links in the docs, needs network"
run = "lychee --no-progress README.md wiki"
